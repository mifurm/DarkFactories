# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: swarmai-darkfactory
metadata:
  template: swarmai-darkfactory@1.0.0
infra:
  provider: bicep
  path: infra
  module: main
services:
  web:
    project: ./app
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .
      remoteBuild: true
hooks:
  postprovision:
    posix:
      shell: sh
      run: bash ./scripts/ensure-tags.sh
      continueOnError: true
