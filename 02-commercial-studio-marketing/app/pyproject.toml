[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "spotlight-studio"
version = "1.0.0"
description = "SwarmAI Commercial Studio (Spotlight) - brief-to-broadcast AI commercial production studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "openai>=1.60,<3.0",
  "azure-identity>=1.19,<2.0",
  "azure-cosmos>=4.7,<5.0",
  "azure-storage-blob>=12.23,<13.0",
  "azure-storage-queue>=12.11,<13.0",
  "azure-monitor-opentelemetry>=1.6,<2.0",
  "aiohttp>=3.10,<4.0",
  "httpx>=0.27,<1.0",
  "numpy>=2.0,<3.0",
  "opencv-python-headless>=4.10,<5.0",  # motion quality gate: Farneback optical flow on the generated clips (abi3 wheels: Python 3.13 on linux/macOS)
  "pillow>=10.4",
  "python-multipart>=0.0.9",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6",
  "mypy>=1.11,<2.0",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotlight = ["assets/**/*", "seed/**/*", "vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -ra"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "slow: renders video with ffmpeg (skipped when ffmpeg is unavailable)",
]

[tool.coverage.run]
source = ["spotlight"]
branch = false
omit = [
  "src/spotlight/core/repo/cosmos.py",   # exercised against real Cosmos DB by scripts/smoke_test.py (build_query is unit-tested)
  "src/spotlight/core/ai/azure.py",      # real Azure OpenAI / Content Safety / Speech adapters: smoke test only
  "src/spotlight/telemetry.py",
  "src/spotlight/main.py",
  "src/spotlight/vendor/*",              # vendored business-case model: tested in business-case/test_model.py + parity test here
]

[tool.coverage.report]
show_missing = false
skip_covered = true
exclude_also = [
  "class AzureBlobStore",                # real Blob adapter: smoke test only
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/spotlight/vendor", ".venv", "web", ".devlog", ".tmp"]  # vendored model.py is owned by business-case/

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["S101", "S311", "B008", "E501", "RUF012", "SIM108", "S603", "S607", "RUF001", "RUF002", "RUF003", "S110", "S112", "S324"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/spotlight/core", "src/spotlight/domain", "src/spotlight/motion"]
