[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotlight-motion-worker"
version = "1.0.0"
description = "Spotlight (Commercial Studio) GPU motion worker: Wan 2.2 TI2V-5B image-to-video behind a queue + blob contract"
readme = "README.md"
requires-python = ">=3.12"
# torch / diffusers / transformers / accelerate / huggingface_hub come from the base image (gpu-quickstart) and are
# imported lazily; they are intentionally NOT listed here.
dependencies = [
  "azure-identity>=1.19,<2.0",
  "azure-storage-blob>=12.23,<13.0",
  "azure-storage-queue>=12.9,<13.0",
  "ftfy>=6.2,<7.0",
  "imageio>=2.34,<3.0",
  "imageio-ffmpeg>=0.5,<1.0",
  "numpy>=1.26",
  "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "jsonschema>=4.21",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["motion_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = [
  "ffmpeg: needs an ffmpeg binary (system or imageio-ffmpeg)",
  "sdk: needs the real Azure SDK packages installed (skipped otherwise)",
]

[tool.coverage.run]
source = ["motion_worker"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise SystemExit",
  "if __name__ == .__main__.:",
  "\\.\\.\\.$",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "PLC0415", "BLE", "S110", "S603"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# style-only rules that fight readable test code (composite asserts, throw-away unpack targets, subprocess of ourselves)
"tests/**" = ["PLC0415", "B017", "PT011", "RUF001", "PT018", "RUF059", "RUF015", "S603", "PT012", "PT017"]
