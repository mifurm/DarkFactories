[project]
name = "concierge"
version = "1.0.0"
description = "SwarmAI Contact Center (Concierge) - AI-first contact center reference implementation on Azure"
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concierge = ["data/*", "data/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --ignore=tests/e2e -p no:cacheprovider"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["concierge"]
branch = false
omit = [
  "src/concierge/core/ai/azure_*.py",
  "src/concierge/core/cosmos_repo.py",
  "src/concierge/core/telemetry.py",
  "src/concierge/features/voice/azure_upstream.py",
  "src/concierge/features/metrics/business_case/*",
]

[tool.coverage.report]
show_missing = false
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["src/concierge/features/metrics/business_case"]  # vendored verbatim from business-case/ (see PROVENANCE.json)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM108", "RUF005", "RUF001", "RUF002", "RUF003", "SIM105", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "RUF015", "SIM117"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
files = ["src/concierge/core", "src/concierge/engine"]
